name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build

      # Emit JUnit XML for the test summary alongside coverage reports.
      - name: Unit Tests with Coverage
        run: bun run test -- --coverage --reporter=junit --outputFile=test-results/unit.xml

      - name: Test Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: "test-results/*.xml"
          reporter: jest-junit

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/

  e2e-tests:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paireval_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/paireval_test
      BASE_URL: http://localhost:3000
      ENABLE_DEV_AUTH: '1'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: npx playwright install --with-deps chromium

      # Apply migrations before exercising persisted workflows.
      - name: Run Database Migrations
        run: bun run db:migrate
      - name: Verify real database workflows
        run: bun run test:workflows
        env:
          ALLOW_TEST_DATABASE: "1"
      # --------------------------------

      - name: Run E2E Tests
        run: bun run test:e2e -- --repeat-each=3

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  deploy-production:
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Production
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  performance:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.PERFORMANCE_BASE_URL != ''

    steps:
      - uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Performance Tests
        run: k6 run --summary-export=performance/results.json performance/load-test.js
        env:
          BASE_URL: ${{ vars.PERFORMANCE_BASE_URL }}

      - name: Upload Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-results-${{ github.sha }}
          path: performance/results.json
