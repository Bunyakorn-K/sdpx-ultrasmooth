name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit Tests with Coverage
        run: bun run test:coverage --reporter=junit --outputFile=test-results/unit.xml

      - name: Test Summary
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results
          path: "test-results/*.xml"
          reporter: jest-junit

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: docs/coverage/

  e2e-tests:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - name: Run Database Migrations
        run: bun run db:migrate

      - name: Run E2E Tests
        run: bun run test:e2e

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  deploy-staging:
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v7
      - name: Verify staging project
        run: |
          if [ -z "$VERCEL_PROJECT_ID" ] || [ "$VERCEL_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then
            echo "Configure a separate VERCEL_STAGING_PROJECT_ID secret for staging."
            exit 1
          fi
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          PRODUCTION_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy to Staging
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

  deploy-production:
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Production
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  performance:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Wait for staging readiness
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: |
          if [[ ! "$BASE_URL" =~ ^https:// ]] || [ "${BASE_URL%/}" = "https://sdpx-ultrasmooth.vercel.app" ]; then
            echo "Set STAGING_URL to the separate HTTPS staging project."
            exit 1
          fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$BASE_URL/api/health" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not become ready."
          exit 1

      - name: Run Performance Tests
        run: k6 run --summary-export=performance/results.json performance/load-test.js
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          PERF_TEST_EMAIL: ${{ vars.PERF_TEST_EMAIL }}

      - name: Upload Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-results-${{ github.sha }}
          path: performance/results.json
