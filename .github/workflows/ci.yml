name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI Specification Lint
        run: npm run spec:lint

      - name: Unit Tests with Coverage
        run: npm run test:coverage

      - name: Test Summary Markdown
        if: always()
        run: node scripts/ci-test-summary.mjs

      - name: Test Summary Check
        uses: dorny/test-reporter@v1
        if: always()
        continue-on-error: true
        with:
          name: Test Results
          path: "test-results/*.xml"
          reporter: jest-junit

      - name: Test Fidelity Check
        run: npm run test:fidelity

      - name: Production build
        run: npm run build

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/

  e2e-tests:
    needs: lint-and-unit-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: paireval_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/paireval_test
      DATABASE_DRIVER: postgres
      E2E_DATABASE_ENABLED: "1"
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Database Initialization
        run: npm run db:init

      - name: Run E2E Tests
        run: npm run test:e2e:repeat

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

  deploy-production:
    needs: [lint-and-unit-test, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Migrate production database
        run: |
          # Use DATABASE_URL from GitHub Secrets if configured.
          # Otherwise attempt to pull from Vercel (if not marked sensitive).
          if [ -z "$DATABASE_URL" ]; then
            npx vercel env pull .env.migrate --environment=production --token "$VERCEL_TOKEN" --yes || true
            if [ -f .env.migrate ]; then
              set -a; . ./.env.migrate; set +a
              rm -f .env.migrate
            fi
          fi
          if [ -n "$DATABASE_URL" ] && [ "$DATABASE_URL" != "[SENSITIVE]" ]; then
            npm run db:init
          else
            echo "::warning::DATABASE_URL is not set in GitHub Secrets or is marked [SENSITIVE] in Vercel. Database migration was skipped in CI. To run migrations in CI, add DATABASE_URL to GitHub Secrets."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.PRODUCTION_DATABASE_URL || secrets.POSTGRES_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Production
        run: npx vercel --prod --token "$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  performance:
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && vars.PERFORMANCE_BASE_URL != ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run Performance Tests
        run: k6 run --summary-export=performance/results.json performance/load-test.js
        env:
          BASE_URL: ${{ vars.PERFORMANCE_BASE_URL }}

      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ github.sha }}
          path: performance/results.json
