services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peerly_test
      POSTGRES_USER: peerly_test
      POSTGRES_PASSWORD: disposable-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: [CMD-SHELL, pg_isready -U peerly_test -d peerly_test]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
  unit:
    build:
      context: .
      target: deps
    working_dir: /app
    volumes:
      - .:/app:ro
      - unit_node_modules:/app/node_modules
      - ./coverage:/app/coverage
      - ./test-results:/app/test-results
    command: npm run test:coverage
    environment:
      NODE_ENV: test
      LOG_LEVEL: silent
    depends_on:
      test-db:
        condition: service_healthy
  e2e:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://peerly_test:disposable-test-only@test-db:5432/peerly_test
      DATABASE_DRIVER: postgres
      E2E_DATABASE_ENABLED: "1"
      LOG_LEVEL: warn
      CI: "1"
    command: sh -c 'npm run db:init && npm run test:e2e'
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    depends_on:
      test-db:
        condition: service_healthy
    profiles: [e2e]
volumes:
  unit_node_modules:
