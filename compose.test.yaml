services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
  
  unit:
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
      NODE_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
    command: bun run test

  e2e:
    build:
      context: .
      target: e2e
    environment:
      DATABASE_URL: postgres://testuser:testpass@test-db:5432/testdb
      BASE_URL: http://localhost:3000
      ENABLE_DEV_AUTH: '1'
      NODE_ENV: test
    depends_on:
      test-db:
        condition: service_healthy
    command: sh -c "bun run db:migrate && bun run test:e2e"
    profiles: ["e2e"]
