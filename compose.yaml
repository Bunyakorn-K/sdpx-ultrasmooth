services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: peerly
      POSTGRES_USER: peerly
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-local-development-only}
    healthcheck:
      test: [CMD-SHELL, pg_isready -U peerly -d peerly]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build:
      context: .
      target: deps
    working_dir: /app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://peerly:${LOCAL_DB_PASSWORD:-local-development-only}@db:5432/peerly
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    command: sh -c 'npm run db:init && npm run dev -- --hostname 0.0.0.0'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
volumes:
  postgres_data:
  app_node_modules:
  app_next:
