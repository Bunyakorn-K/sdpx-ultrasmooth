services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://user:pass@db:5432/paireval}
      NODE_ENV: development
      NEON_AUTH_BASE_URL: ${NEON_AUTH_BASE_URL:-}
      NEON_AUTH_COOKIE_SECRET: ${NEON_AUTH_COOKIE_SECRET:-}
      TEACHER_AUTH_IDS: ${TEACHER_AUTH_IDS:-}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-0}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "bun run db:migrate && bun dev --hostname 0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: paireval
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d paireval"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
