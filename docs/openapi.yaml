openapi: 3.1.0
info:
  title: Peerly API
  version: 1.1.0
  description:
    Group peer evaluation. Cookie sessions and same-origin mutations. Auth compatibility
    POST /api/auth and command POST /api/assignments remain for older clients; canonical routes
    below are used by the current client. Test-only seed/cleanup are deliberately excluded from the
    public contract.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API (local or configured staging host)
tags:
  - name: Notifications
    description: Private student in-app inbox; email and push delivery are deferred
  - name: Health
    description: Readiness
  - name: Auth
    description: Registration and session authentication
  - name: Assignments
    description: Assignments, groups, questions and peer evaluations
security:
  - cookieAuth: []
paths:
  /api/assignments/{id}/exports/raw:
    post:
      operationId: exportRawComparisons
      summary: Owner downloads raw comparisons as UTF-8 BOM CSV
      description: Same-origin cookie session and assignment/classroom ownership required. Defaults to per-file pseudonyms for evaluators and items. Identified exports require explicit confirmation and durable EXPORT_IDENTITY audit before returning the file. Current or finalized comparison set only; drafts are omitted and excluded rows retain EXCLUDED status. No-store response.
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityMode:
                  type: string
                  enum: [pseudonymous, identified]
                  default: pseudonymous
                confirmIdentity:
                  type: boolean
                  default: false
                  description: Must be true for identified mode.
      responses:
        "200":
          description: Raw comparison CSV attachment; pseudonyms are consistent within this file and rotated on every export.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid mode or identity export not confirmed. }
        "401": { description: Sign-in required. }
        "403": { description: Owner and same-origin request required. }
        "404": { description: Assignment missing. }
        "409": { description: Assignment has no pairwise data. }
        "503":
          {
            description: Database or audit unavailable; no identified file is returned.,
          }
  /api/appeals:
    post:
      operationId: submitAppeal
      summary: Student appeals finalized results within seven days
      description: One request per student per finalization and pair generation. Same-origin cookie session and assignment student membership required. Assignment reads include the caller's private appeals and a public finalizedAt timestamp.
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, expectedFinalizedAt, message]
              properties:
                id: { type: string, format: uuid }
                expectedFinalizedAt: { type: string, format: date-time }
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Request and audit saved atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentResponse" }
        "400": { description: Invalid reason or identifier. }
        "401": { description: Sign-in required. }
        "403": { description: Student membership and same origin required. }
        "404": { description: Assignment not found. }
        "409":
          {
            description: "Not finalized, stale result, expired window or duplicate request.",
          }
  /api/assignments/{id}/appeals:
    put:
      operationId: resolveAppeal
      summary: Owning teacher responds and upholds or overrides the appellant's total
      description: Immutable decision with required explanation for the current finalization and generation. Override is bounded by the assignment maximum and affects only the appellant. Raw snapshot remains unchanged. Teacher can resolve after the intake window. Read requests via GET /api/assignments/{id}; students receive only their own requests.
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appealId, expectedFinalizedAt, outcome, response]
              properties:
                appealId: { type: string, format: uuid }
                expectedFinalizedAt: { type: string, format: date-time }
                outcome: { type: string, enum: [uphold, override] }
                response: { type: string, minLength: 1, maxLength: 2000 }
                score:
                  {
                    type: number,
                    minimum: 0,
                    description: Required for override and bounded by the assignment total maximum.,
                  }
      responses:
        "200":
          description: Decision and audit saved atomically; results and exports include the override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentResponse" }
        "400": { description: "Invalid response, outcome or score." }
        "401": { description: Sign-in required. }
        "403": { description: Owning teacher and same origin required. }
        "404": { description: Assignment or appeal not found. }
        "409":
          {
            description: "Not finalized, stale result, old generation or already resolved.",
          }
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List the student's notifications and unread count
      description: Creates deduplicated reminders on access for active assignments due within 48 hours that still have eligible unfinished work. Returns 20 items per page, newest first. No score or evaluator identity is included. Teacher accounts are rejected.
      tags: [Notifications]
      parameters:
        - in: query
          name: before
          description: Opaque nextCursor from the previous response; URL-encode it without modification.
          schema: { type: string }
      responses:
        "200":
          description: Private inbox; Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount, nextCursor]
                properties:
                  unreadCount: { type: integer, minimum: 0 }
                  nextCursor: { type: [string, "null"] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, assignmentId, kind, createdAt, readAt]
                      properties:
                        id: { type: string, format: uuid }
                        assignmentId: { type: string, format: uuid }
                        kind:
                          {
                            type: string,
                            enum:
                              [
                                assignment_opened,
                                deadline_reminder,
                                results_finalized,
                                pairs_regenerated,
                              ],
                          }
                        createdAt: { type: string, format: date-time }
                        readAt: { type: [string, "null"], format: date-time }
        "400": { description: Invalid pagination cursor. }
        "401": { description: Sign-in required. }
        "403": { description: Student role required. }
        "503": { description: Database unavailable. }
  /api/notifications/{id}/read:
    patch:
      operationId: readNotification
      summary: Mark one owned and accessible notification as read
      description: Same-origin request required. Repeated reads preserve the original read time.
      tags: [Notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Read state saved. }
        "400": { description: Invalid notification ID. }
        "401": { description: Sign-in required. }
        "403": { description: Student role and same-origin request required. }
        "404":
          {
            description: Notification missing or not owned or no longer accessible.,
          }
        "503": { description: Database unavailable. }
  /api/notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: Mark all currently accessible notifications of the student as read
      description: Same-origin request required; includes all history pages and does not affect another user's inbox.
      tags: [Notifications]
      responses:
        "200": { description: Read states saved. }
        "401": { description: Sign-in required. }
        "403": { description: Student role and same-origin request required. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/unpublish:
    post:
      operationId: unpublishPairs
      summary: Owner returns evaluation to Draft
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedGeneration]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedGeneration: { type: integer, minimum: 0 }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/configure:
    post:
      operationId: configurePairs
      summary: Owner updates pairing settings in Draft
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  reason,
                  expectedGeneration,
                  targetCoverage,
                  maxWorkload,
                  deadline,
                ]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedGeneration: { type: integer, minimum: 0 }
                targetCoverage: { type: integer, minimum: 1, maximum: 50 }
                maxWorkload: { type: integer, minimum: 1, maximum: 100 }
                deadline: { type: string, format: date-time }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/preview:
    post:
      operationId: previewPairs
      summary: Owner previews feasible pairs and impact without mutation
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [group, individual, both] }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/regenerate:
    post:
      operationId: regeneratePairs
      summary: Owner atomically archives replaced answers and publishes a generation
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, expectedGeneration, scope, previewToken]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
                expectedGeneration: { type: integer, minimum: 0 }
                scope: { type: string, enum: [group, individual, both] }
                previewToken:
                  {
                    type: string,
                    description: Exact unchanged token from the latest preview.,
                  }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/drafts:
    put:
      operationId: saveEvaluationDrafts
      summary: Autosave assigned comparison drafts without changing submitted scores
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationBatchInput" }
      responses:
        "200":
          {
            description: Drafts persisted atomically; returns assignment with only this student's drafts and revision history.,
          }
        "400":
          {
            description: Invalid choices or duplicate pair IDs; entire batch rejected.,
          }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assigned student and same origin required; evaluation must be open and before deadline.,
          }
        "404": { description: Assignment missing. }
        "409": { description: Stale generation or submission revision. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/submissions:
    post:
      operationId: submitEvaluation
      summary: Atomically submit or resubmit one evaluation side with an immutable revision and audit entry
      description: Answers are a complete snapshot of the student's selected side, including partial or empty submissions. Replaces only that side's submitted comparisons, clears its drafts and retains previous revisions. Other sides and evaluators are unchanged.
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationBatchInput" }
      responses:
        "200":
          {
            description: Latest submitted comparisons and revision persisted atomically; returns assignment.,
          }
        "400":
          {
            description: Invalid choices or duplicate pair IDs; entire batch rejected.,
          }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assigned student and same origin required; evaluation must be open and before deadline.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: Stale generation or submission revision; concurrent duplicate rejected.,
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/pairs/submit:
    post:
      operationId: submitPair
      deprecated: true
      summary: Student submits a comparison assigned in the current generation
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairId, choice, expectedGeneration]
              properties:
                pairId: { type: string }
                choice: { type: integer, minimum: 1, maximum: 6 }
                expectedGeneration: { type: integer, minimum: 0 }
                timeOnTaskMs: { type: number, minimum: 0 }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/reopen:
    post:
      operationId: reopenAssignment
      summary: Owner reopens finalized results with a reason
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          {
            description: "Preview returns preview containing generation, pairs, token, coverage, targetCoverage, affectedStudentIds, replacedAnswers, totalComparisons, workload and disabledIndividualGroups. Mutations return assignment.",
          }
        "400": { description: Invalid input or infeasible pairing. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Owner or assigned student and same-origin request required.,
          }
        "404": { description: Assignment missing. }
        "409":
          {
            description: "Stale preview or generation, invalid lifecycle state, or duplicate submission.",
          }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/clone:
    post:
      operationId: cloneAssignment
      summary: Owner clones an assignment into a fresh draft
      description: "Traceability: FR-ASSIGN-06. Duplicates title, description, subject, criteria, artifact link, and scoring configuration into a new assignment in draft state with a future deadline. Zeroes answers, pairs, and submissions."
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201": { description: Cloned assignment created in draft state. }
        "401": { description: Sign-in required. }
        "403": { description: Teacher role and same-origin request required. }
        "404": { description: Source assignment not found. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/deadline:
    post:
      operationId: updateAssignmentDeadline
      summary: Owner updates assignment deadline (extension or shortening)
      description: "Traceability: FR-ASSIGN-04. Extension is allowed anytime; shortening is allowed only before the original deadline arrives."
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deadline]
              properties:
                deadline: { type: string, format: date-time }
      responses:
        "200": { description: Assignment with updated deadline. }
        "400":
          {
            description: "Invalid deadline format, shortening after original deadline, or assignment finalized.",
          }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assignment owner teacher and same-origin request required.,
          }
        "404": { description: Assignment not found. }
        "409": { description: Concurrent updates could not be resolved. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/finalize:
    post:
      operationId: finalizeAssignment
      summary: Owner finalizes a closed assignment and creates student notifications
      description: Uses existing domain validation, optimistic concurrency, and an atomic notification/audit write.
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          {
            description: Finalized assignment with notification events persisted.,
          }
        "400": { description: Assignment is not closed or ID/body is invalid. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assignment owner teacher and same-origin request required.,
          }
        "404": { description: Assignment not found. }
        "409": { description: Concurrent updates could not be resolved. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/scores/override:
    post:
      operationId: overrideScore
      summary: Owner overrides group or student score with mandatory reason
      description: "Traceability: FR-SCORE-08. Allows instructor to override student or group score with mandatory reason and audit log recording."
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, score, reason]
              properties:
                targetId: { type: string }
                targetType:
                  { type: string, enum: [student, group], default: student }
                score: { type: number, minimum: 0 }
                reason: { type: string, minLength: 1 }
      responses:
        "200": { description: Assignment with the recorded score override. }
        "400":
          { description: "Missing targetId, negative score, or empty reason." }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assignment owner teacher and same-origin request required.,
          }
        "404": { description: Assignment not found. }
        "409": { description: Concurrent updates could not be resolved. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/recompute:
    post:
      operationId: recomputeInterimScores
      summary: Owner triggers on-demand interim score recalculation
      description: "Traceability: FR-SCORE-06. Recomputes assignment interim scores immediately on demand."
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          {
            description: Assignment with updated interim calculation timestamp.,
          }
        "400": { description: Assignment is draft or cannot be recomputed. }
        "401": { description: Sign-in required. }
        "403":
          {
            description: Assignment owner teacher and same-origin request required.,
          }
        "404": { description: Assignment not found. }
        "409": { description: Concurrent updates could not be resolved. }
        "503": { description: Database unavailable. }
  /api/health:
    get:
      operationId: health
      summary: Application readiness
      description: "Traceability: US00 in docs/backlog.md."
      tags:
        - Health
      x-user-stories:
        - US00
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: &a1
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: peerly
        "400": &a2
          description: Invalid JSON, identifier or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": &a3
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": &a4
          description: Wrong origin, role or ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": &a5
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": &a6
          description: Duplicate vote/email or concurrent update conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": &a7
          description: Request body exceeds 128 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": &a8
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": &a9
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth:
    get:
      operationId: session
      summary: Read current session and configuration state
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - configured
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/User"
                      - type: "null"
                  configured:
                    type: boolean
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/auth/register:
    post:
      operationId: register
      summary: Register and create a session
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security: []
      parameters:
        - &a10
          name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must match APP_ORIGIN when configured, otherwise the request origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
