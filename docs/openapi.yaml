components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pair_session
      description: Opaque HttpOnly session; Secure over HTTPS and SameSite=Lax. Login/Register issue the cookie.
  schemas:
    EvaluationBatchInput:
      type: object
      required: [side, expectedGeneration, expectedRevision, answers]
      properties:
        side: { type: string, enum: [GROUP, INDIVIDUAL] }
        expectedGeneration: { type: integer, minimum: 1 }
        expectedRevision:
          {
            type: integer,
            minimum: 0,
            description: Number of existing submissions for this evaluator and side; use 0 before first submission.,
          }
        answers:
          type: array
          items:
            type: object
            required: [pairId, choice]
            properties:
              pairId: { type: string }
              choice: { type: integer, minimum: 1, maximum: 6 }
              timeOnTaskMs: { type: number, minimum: 0 }
    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id: *a1
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - teacher
            - student
    Member:
      type: object
      required:
        - id
        - name
      properties:
        id: *a1
        name:
          type: string
    Group:
      type: object
      required:
        - id
        - name
        - members
      properties:
        id: *a1
        name:
          type: string
          minLength: 1
          maxLength: 100
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Vote:
      type: object
      required:
        - userId
        - scores
        - createdAt
      oneOf:
        - required: [groupId]
        - required: [studentId]
      properties:
        userId:
          type: string
          description: User UUID for the owner/current voter; anonymous for other voters in student results.
        groupId: *a1
        studentId: *a1
        scores:
          type: array
          items: *a12
          minItems: 1
          maxItems: 100
        createdAt: &a13
          type: string
          format: date-time
    Questions:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1000
      maxItems: 100
    AssignmentCreate:
      type: object
      required:
        - title
        - deadline
      properties:
        evaluationMode:
          type: string
          enum: [group, individual]
          default: group
          description: Individual mode evaluates students from other groups, using the same questions and 1–6 score scale.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        subject:
          type: string
          maxLength: 100
        deadline: *a13
        questions:
          $ref: "#/components/schemas/Questions"
    Assignment:
      type: object
      required:
        - id
        - ownerId
        - title
        - description
        - subject
        - deadline
        - status
        - questions
        - groups
        - students
        - votes
        - createdAt
        - color
      properties:
        finalizedAt:
          type: string
          format: date-time
          readOnly: true
          description: Public finalization timestamp for the appeal window; raw snapshot is owner-only.
        appeals:
          type: array
          readOnly: true
          description: All requests for the owner; only the caller's requests for students. Prior finalization requests remain read-only history.
          items:
            type: object
            required:
              [id, studentId, message, submittedAt, finalizedAt, generation]
            properties:
              id: { type: string, format: uuid }
              studentId: { type: string, format: uuid }
              message: { type: string }
              submittedAt: { type: string, format: date-time }
              finalizedAt: { type: string, format: date-time }
              generation: { type: integer, minimum: 0 }
              decision:
                type: object
                required: [outcome, response, decidedBy, decidedAt]
                properties:
                  outcome: { type: string, enum: [uphold, override] }
                  response: { type: string }
                  score: { type: number, minimum: 0 }
                  decidedBy:
                    {
                      type: string,
                      description: Teacher identity masked for students.,
                    }
                  decidedAt: { type: string, format: date-time }
        pairGeneration: { type: integer, minimum: 0 }
        pairwiseRequired:
          type: boolean
          readOnly: true
          description: Server-set on new assignments. Opening requires a confirmed persisted-pair preview; cannot be disabled through input.
        classroomRosterManaged:
          type: boolean
          readOnly: true
          description: Classroom CSV supplies membership and groups for every draft. Published generations retain their roster until unpublish and regeneration. Students cannot create or select assignment groups.
        evaluationDrafts:
          type: array
          description: Private drafts visible only to their evaluator; excluded from all scoring, coverage and participation calculations.
          items: { type: object }
        evaluationSubmissions:
          type: array
          description: Immutable submission revisions by evaluator and side. Students receive only their own revisions; latest submitted snapshot is used for scoring.
          items: { type: object }
        pairs:
          type: array
          description: Persisted assigned pairs. Students receive only their own assignments.
          items:
            type: object
            required:
              [
                id,
                criterion_id,
                side,
                item_a_id,
                item_b_id,
                evaluator_user_id,
                display_left_item_id,
                generation,
              ]
            properties:
              id: { type: string }
              criterion_id: { type: string }
              side: { type: string, enum: [GROUP, INDIVIDUAL] }
              item_a_id: { type: string }
              item_b_id: { type: string }
              evaluator_user_id: { type: string }
              display_left_item_id: { type: string }
              generation: { type: integer, minimum: 1 }
        comparisons:
          type: array
          description: Current-generation responses. Students receive only their own answers.
          items:
            type: object
            properties:
              pair_assignment_id: { type: string }
              choice: { type: integer, minimum: 1, maximum: 6 }
              evaluator_user_id: { type: string }
              status: { type: string, enum: [SUBMITTED] }
        pairHistory:
          type: array
          description: Read-only archived answers; student projections exclude other evaluators and owner snapshots.
          items: { type: object }
        pairResult:
          type: object
          description: Own aggregate result only after close or finalize; individual score is null below anonymity threshold.
          properties:
            groupScore: { type: number }
            individualScore: { type: [number, "null"] }
            finalScore: { type: [number, "null"] }
        evaluationMode:
          type: string
          enum: [group, individual]
          description: Absent in older assignments, which use group evaluation.
        id: *a1
        ownerId: *a1
        title:
          type: string
        description:
          type: string
        subject:
          type: string
        deadline: *a13
        status:
          type: string
          enum:
            - draft
            - active
            - closed
            - finalized
        questions:
          $ref: "#/components/schemas/Questions"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        students:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        votes:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
        createdAt: *a13
        color:
          type: string
    AssignmentResponse:
      type: object
      required:
        - assignment
      properties:
        assignment:
          $ref: "#/components/schemas/Assignment"
    Login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
    Register:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        role:
          type: string
          enum:
            - teacher
            - student
