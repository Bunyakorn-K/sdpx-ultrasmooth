openapi: 3.1.0
info:
  title: Peerly API
  version: 1.1.0
  description: Group peer evaluation. Cookie sessions and same-origin mutations. Auth compatibility
    POST /api/auth and command POST /api/assignments remain for older clients; canonical routes
    below are used by the current client. Test-only seed/cleanup are deliberately excluded from the
    public contract.
  license:
    name: UNLICENSED
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: Same-origin API (local or configured staging host)
tags:
  - name: Notifications
    description: Private student in-app inbox; email and push delivery are deferred
  - name: Health
    description: Readiness
  - name: Auth
    description: Registration and session authentication
  - name: Assignments
    description: Assignments, groups, questions and peer evaluations
security:
  - cookieAuth: []
paths:
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List the student's notifications and unread count
      description: Creates deduplicated reminders on access for active assignments due within 48 hours that still have eligible unfinished work. Returns 20 items per page, newest first. No score or evaluator identity is included. Teacher accounts are rejected.
      tags: [Notifications]
      parameters:
        - in: query
          name: before
          description: Opaque nextCursor from the previous response; URL-encode it without modification.
          schema: { type: string }
      responses:
        "200":
          description: Private inbox; Cache-Control is no-store.
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount, nextCursor]
                properties:
                  unreadCount: { type: integer, minimum: 0 }
                  nextCursor: { type: [string, "null"] }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, assignmentId, kind, createdAt, readAt]
                      properties:
                        id: { type: string, format: uuid }
                        assignmentId: { type: string, format: uuid }
                        kind: { type: string, enum: [assignment_opened, deadline_reminder, results_finalized] }
                        createdAt: { type: string, format: date-time }
                        readAt: { type: [string, "null"], format: date-time }
        "400": { description: Invalid pagination cursor. }
        "401": { description: Sign-in required. }
        "403": { description: Student role required. }
        "503": { description: Database unavailable. }
  /api/notifications/{id}/read:
    patch:
      operationId: readNotification
      summary: Mark one owned and accessible notification as read
      description: Same-origin request required. Repeated reads preserve the original read time.
      tags: [Notifications]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Read state saved. }
        "400": { description: Invalid notification ID. }
        "401": { description: Sign-in required. }
        "403": { description: Student role and same-origin request required. }
        "404": { description: Notification missing or not owned or no longer accessible. }
        "503": { description: Database unavailable. }
  /api/notifications/read-all:
    post:
      operationId: readAllNotifications
      summary: Mark all currently accessible notifications of the student as read
      description: Same-origin request required; includes all history pages and does not affect another user's inbox.
      tags: [Notifications]
      responses:
        "200": { description: Read states saved. }
        "401": { description: Sign-in required. }
        "403": { description: Student role and same-origin request required. }
        "503": { description: Database unavailable. }
  /api/assignments/{id}/finalize:
    post:
      operationId: finalizeAssignment
      summary: Owner finalizes a closed assignment and creates student notifications
      description: Uses existing domain validation, optimistic concurrency, and an atomic notification/audit write.
      tags: [Assignments]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Finalized assignment with notification events persisted. }
        "400": { description: Assignment is not closed or ID/body is invalid. }
        "401": { description: Sign-in required. }
        "403": { description: Assignment owner teacher and same-origin request required. }
        "404": { description: Assignment not found. }
        "409": { description: Concurrent updates could not be resolved. }
        "503": { description: Database unavailable. }
  /api/health:
    get:
      operationId: health
      summary: Application readiness
      description: "Traceability: US00 in docs/backlog.md."
      tags:
        - Health
      x-user-stories:
        - US00
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: &a1
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: peerly
        "400": &a2
          description: Invalid JSON, identifier or business rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401": &a3
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": &a4
          description: Wrong origin, role or ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": &a5
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409": &a6
          description: Duplicate vote/email or concurrent update conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413": &a7
          description: Request body exceeds 128 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429": &a8
          description: Too many authentication attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": &a9
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth:
    get:
      operationId: session
      summary: Read current session and configuration state
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - configured
                properties:
                  user:
                    oneOf:
                      - $ref: "#/components/schemas/User"
                      - type: "null"
                  configured:
                    type: boolean
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/auth/register:
    post:
      operationId: register
      summary: Register and create a session
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security: []
      parameters:
        - &a10
          name: Origin
          in: header
          required: true
          schema:
            type: string
            format: uri
          description: Must match APP_ORIGIN when configured, otherwise the request origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Register"
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/auth/login:
    post:
      operationId: login
      summary: Log in and create a session
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: "Traceability: US01 in docs/backlog.md."
      tags:
        - Auth
      x-user-stories:
        - US01
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/auth/complete-profile:
    post:
      operationId: completeProfile
      summary: Complete user profile with display name and role after OAuth sign-in
      tags:
        - Auth
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - role
              properties:
                name:
                  type: string
                  maxLength: 100
                role:
                  type: string
                  enum: [teacher, student]
      responses:
        "200":
          description: Profile completed successfully
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - user
                properties:
                  ok:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments:
    get:
      operationId: listAssignments
      summary: List owned or joined assignments
      description: "Traceability: US02, US03 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US02
        - US03
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                type: object
                required:
                  - assignments
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
    post:
      operationId: createAssignment
      summary: Teacher creates assignment directly with a join code
      description: "Traceability: US02 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US02
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentCreate"
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/join:
    post:
      operationId: joinAssignment
      summary: Student joins a draft assignment by code
      description: "Traceability: US03 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US03
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}:
    parameters:
      - &a11
        name: id
        in: path
        required: true
        schema: *a1
        description: Assignment UUID
    get:
      operationId: getAssignment
      summary: Read an owned or joined assignment with role-specific vote visibility
      description: "Traceability: US02, US03, US08 in docs/backlog.md. Teachers can export this data to
        Excel in the browser (US10); Excel export has no separate server endpoint."
      tags:
        - Assignments
      x-user-stories:
        - US02
        - US03
        - US08
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/groups:
    parameters:
      - *a11
    post:
      operationId: createGroup
      summary: Create a group before voting starts
      description: "Traceability: US04 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US04
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/groups/join:
    parameters:
      - *a11
    post:
      operationId: joinGroup
      summary: Student joins exactly one group per assignment
      description: "Traceability: US04 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US04
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupId
              properties:
                groupId: *a1
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/questions:
    parameters:
      - *a11
    put:
      operationId: updateQuestions
      summary: Owner replaces question list before voting; Excel import uses this same contract
      description: "Traceability: US05, US09 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US05
        - US09
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - questions
              properties:
                questions:
                  $ref: "#/components/schemas/Questions"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/voting/start:
    parameters:
      - *a11
    post:
      operationId: startVoting
      summary: Owner opens voting with questions and two populated groups
      description: "Traceability: US06 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US06
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/voting/stop:
    parameters:
      - *a11
    post:
      operationId: stopVoting
      summary: Owner closes voting and publishes final scores
      description: "Traceability: US08 in docs/backlog.md."
      tags:
        - Assignments
      x-user-stories:
        - US08
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
  /api/assignments/{id}/votes:
    parameters:
      - *a11
    post:
      operationId: submitVote
      summary: Student scores another group or an individual from another group
      description: "Traceability: US07 and US11 in docs/backlog.md. Each student's own session identifies the voter. Group mode requires groupId; individual mode requires studentId from another populated group. Reject self/same-group targets, duplicate ballots and submissions outside active voting or after deadline."
      tags:
        - Assignments
      x-user-stories:
        - US07
      security:
        - cookieAuth: []
      parameters:
        - *a10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - scores
              oneOf:
                - required: [groupId]
                - required: [studentId]
              properties:
                groupId: *a1
                studentId: *a1
                scores:
                  type: array
                  items: &a12
                    type: integer
                    minimum: 1
                    maximum: 6
                  minItems: 1
                  maxItems: 100
                  description: Exactly one score per assignment question.
      responses:
        "201":
          description: Created
          headers:
            x-request-id:
              description: Correlation ID for this request
              schema: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400": *a2
        "401": *a3
        "403": *a4
        "404": *a5
        "409": *a6
        "413": *a7
        "429": *a8
        "503": *a9
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pair_session
      description: Opaque HttpOnly session; Secure over HTTPS and SameSite=Lax. Login/Register issue the cookie.
  schemas:
    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
        code:
          type: string
    User:
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id: *a1
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - teacher
            - student
    Member:
      type: object
      required:
        - id
        - name
      properties:
        id: *a1
        name:
          type: string
    Group:
      type: object
      required:
        - id
        - name
        - members
      properties:
        id: *a1
        name:
          type: string
          minLength: 1
          maxLength: 100
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Vote:
      type: object
      required:
        - userId
        - scores
        - createdAt
      oneOf:
        - required: [groupId]
        - required: [studentId]
      properties:
        userId:
          type: string
          description: User UUID for the owner/current voter; anonymous for other voters in student results.
        groupId: *a1
        studentId: *a1
        scores:
          type: array
          items: *a12
          minItems: 1
          maxItems: 100
        createdAt: &a13
          type: string
          format: date-time
    Questions:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 1000
      maxItems: 100
    AssignmentCreate:
      type: object
      required:
        - title
        - deadline
      properties:
        evaluationMode:
          type: string
          enum: [group, individual]
          default: group
          description: Individual mode evaluates students from other groups, using the same questions and 1–6 score scale.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        subject:
          type: string
          maxLength: 100
        deadline: *a13
        questions:
          $ref: "#/components/schemas/Questions"
    Assignment:
      type: object
      required:
        - id
        - ownerId
        - title
        - description
        - subject
        - code
        - deadline
        - status
        - questions
        - groups
        - students
        - votes
        - createdAt
        - color
      properties:
        evaluationMode:
          type: string
          enum: [group, individual]
          description: Absent in older assignments, which use group evaluation.
        id: *a1
        ownerId: *a1
        title:
          type: string
        description:
          type: string
        subject:
          type: string
        code:
          type: string
          pattern: ^[0-9]{6}$
        deadline: *a13
        status:
          type: string
          enum:
            - draft
            - active
            - closed
        questions:
          $ref: "#/components/schemas/Questions"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
        students:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        votes:
          type: array
          items:
            $ref: "#/components/schemas/Vote"
